name: Build endlesscursor

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Cursor.zip
        shell: bash
        run: |
          if [ ! -f "Cursor.zip" ]; then
            echo "HATA: Cursor.zip bulunamadı!"
            echo "Repository dosyaları:"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          mkdir -p endlesscursor
          unzip -o "Cursor.zip" -d endlesscursor

      - name: Find Gradle project
        shell: bash
        run: |
          GRADLEW=$(find endlesscursor -type f -name "gradlew" -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "HATA: Cursor.zip içinde gradlew bulunamadı!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build endlesscursor
        shell: bash
        run: |
          chmod +x "$PROJECT_DIR/gradlew"
          cd "$PROJECT_DIR"
          ./gradlew build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: endlesscursor
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
