name: Build endlesscursor

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "endlesscursor*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "endlesscursor ZIP bulunamadı!"
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"
          mkdir -p endlesscursor
          unzip -q "$ZIP_FILE" -d endlesscursor

      - name: Find Gradle project
        shell: bash
        run: |
          GRADLEW=$(find endlesscursor -type f -name "gradlew" -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "gradlew bulunamadı!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Proje: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build endlesscursor
        shell: bash
        run: |
          chmod +x "$PROJECT_DIR/gradlew"
          cd "$PROJECT_DIR"
          ./gradlew build --no-daemon

      - name: Show JAR files
        run: |
          find "$PROJECT_DIR/build/libs" -type f -name "*.jar" -print

      - name: Upload endlesscursor JAR
        uses: actions/upload-artifact@v4
        with:
          name: endlesscursor
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
